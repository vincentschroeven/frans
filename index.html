<head>

<style>
:root{--bg:#FAF7F2;--card:#FFFFFF;--line:#ECE6DC;--ink:#2F3238;--mute:#8A8478;--peach:#E3A587;--peachInk:#3E2214;--peachSoft:#F6E3D8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:22px 20px 28px;display:flex;flex-direction:column;gap:18px}
.head{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute)}
.chip{font-size:14px;font-weight:600;color:var(--mute)}
.bar{height:3px;border-radius:2px;background:var(--line)}.bar>div{height:100%;border-radius:2px;background:var(--peach);transition:width .4s ease}
.hello{font-size:30px;font-weight:700;line-height:1.15;margin:6px 0 0}
h1{margin:0;font-size:19px;line-height:1.3;font-weight:600}
.muted{color:var(--mute)}.small{font-size:14px}.s15{font-size:15px}
.grow{flex-grow:1;display:flex;flex-direction:column;gap:18px}
.bottom{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:8px}
.btn{height:54px;border:none;border-radius:14px;background:var(--peach);color:var(--peachInk);font:inherit;font-weight:700;cursor:pointer;width:100%}
.btn:disabled{background:var(--line);color:#A39C90;cursor:default}
.btn2{height:54px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;width:100%}
.link{border:none;background:none;color:var(--mute);font:inherit;font-size:15px;text-decoration:underline;cursor:pointer;padding:8px}
.list{border-radius:16px;padding:2px 16px;background:var(--card);border:1px solid var(--line)}
.row{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}.row:last-child{border-bottom:none}
.txt{display:flex;flex-direction:column;flex-grow:1;min-width:0}
.sr{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.sw{width:46px;height:28px;border-radius:999px;flex:none;position:relative;background:var(--line);transition:background .2s ease}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.12);transition:left .2s ease}
input:checked + .sw{background:var(--peach)}
input:checked + .sw::after{left:21px}
input:focus-visible + .sw{outline:2px solid var(--peach);outline-offset:2px}
.pills{display:flex;gap:8px}.pill{flex:1;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}.pill.on{background:var(--peachSoft);border-color:var(--peach);color:var(--peachInk)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.sent{font-size:22px;font-weight:600;line-height:1.35}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{min-height:52px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;text-align:left;padding:10px 14px;cursor:pointer;width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px}
.opt.right{background:#E3F0E6;border-color:#9CC3A6;color:#24452E;font-weight:600}
.opt.wrong{color:#A39C90;text-decoration:line-through}
.dropzone{min-height:58px;border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1px dashed #D9D1C3;background:var(--card)}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;padding:7px 12px;cursor:pointer}.tile.in{background:var(--peachSoft);border-color:var(--peach);color:var(--peachInk)}
.inp{height:52px;border:1px solid #D9D1C3;border-radius:12px;padding:0 14px;font:inherit;font-size:18px;width:100%;color:var(--ink);background:var(--card);outline:none}
.inp:focus{border-color:var(--peach);box-shadow:0 0 0 3px var(--peachSoft)}
.fb{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:14px}
.v-ok{font-weight:700;color:#2F6B43}.v-no{font-weight:700;color:#A15A36}
.saywrap{display:flex;gap:12px;align-items:flex-start}
.spk{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.play{width:68px;height:68px;border-radius:50%;border:none;background:var(--peach);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.lrow{display:flex;align-items:center;gap:16px}
.cheer{font-size:30px;font-weight:700;line-height:1.15}
.ring{align-self:center;width:140px;height:140px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:10px}
.ring>div{width:116px;height:116px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700}
.sep{border-top:1px solid var(--line);padding-top:10px}
@media (prefers-reduced-motion: reduce){.bar>div,.sw,.sw::after{transition:none}}
</style>
</head>

<script>
class Data {
  cards() {
    return [
      { fr: "parce que", nl: "omdat", ex: "Je reste à la maison parce que je suis malade.", exNl: "Ik blijf thuis omdat ik ziek ben." },
      { fr: "car", nl: "want", ex: "Je prends un pull, car il fait froid.", exNl: "Ik neem een trui, want het is koud." },
      { fr: "pendant que", nl: "terwijl (tegelijk)", ex: "Il lit pendant que je cuisine.", exNl: "Hij leest terwijl ik kook." },
      { fr: "alors que", nl: "terwijl (tegenstelling)", ex: "Il fait beau, alors que la météo annonçait de la pluie.", exNl: "Het is mooi weer, terwijl het weerbericht regen voorspelde." },
      { fr: "dès que", nl: "zodra", ex: "Appelle-moi dès que tu arrives.", exNl: "Bel me zodra je aankomt." },
      { fr: "puisque", nl: "aangezien", ex: "Puisque tu es là, tu peux m'aider.", exNl: "Aangezien je er bent, kan je me helpen." },
      { fr: "sinon", nl: "anders", ex: "Dépêche-toi, sinon on va rater le train.", exNl: "Haast je, anders missen we de trein." }
    ];
  }

  topics() {
    return [
      { key: "voeg", color: "#F2A38F", name: "Voegwoorden", ex: [
        { t: "mc", label: "pendant que (terwijl, tegelijk)", q: "Wat betekent «pendant que» hier?", s: "Elle chante pendant qu'elle travaille.", full: "Elle chante pendant qu'elle travaille.", nl: "Ze zingt terwijl ze werkt.", o: ["terwijl (tegelijk)", "omdat", "zodra"], a: 0, tip: "Pendant que: twee dingen gebeuren tegelijk." },
        { t: "mc", label: "dès que (zodra)", q: "Wat betekent «dès que» hier?", s: "Je t'écris dès que j'ai les résultats.", full: "Je t'écris dès que j'ai les résultats.", nl: "Ik schrijf je zodra ik de resultaten heb.", o: ["aangezien", "zodra", "anders"], a: 1, tip: "Dès que = zodra." },
        { t: "mc", label: "sinon (anders)", q: "Wat betekent «sinon» hier?", s: "Prends un parapluie, sinon tu seras mouillé.", full: "Prends un parapluie, sinon tu seras mouillé.", nl: "Neem een paraplu, anders word je nat.", o: ["omdat", "terwijl", "anders"], a: 2, tip: "Sinon = anders: wat er gebeurt als je het niet doet." },
        { t: "mc", label: "parce que (omdat)", q: "Welk woord past?", s: "Je ne viens pas ___ je dois étudier.", full: "Je ne viens pas parce que je dois étudier.", nl: "Ik kom niet omdat ik moet studeren.", o: ["parce que", "sinon", "dès que", "alors que"], a: 0, tip: "Er volgt een reden (omdat): parce que.", why: { 1: "Sinon = anders. Dat geeft geen reden.", 2: "Dès que = zodra. Dat gaat over tijd, niet over een reden.", 3: "Alors que = terwijl (tegenstelling). Hier volgt een reden." } },
        { t: "mc", label: "alors que (terwijl, tegenstelling)", q: "Welk woord past?", s: "Mon frère adore le sport, ___ moi, je le déteste.", full: "Mon frère adore le sport, alors que moi, je le déteste.", nl: "Mijn broer is gek op sport, terwijl ik er een hekel aan heb.", o: ["pendant que", "alors que", "puisque", "donc"], a: 1, tip: "Tegenstelling: alors que. Tegelijk (in de tijd): pendant que.", why: { 0: "Pendant que is 'terwijl' in de tijd: twee dingen tegelijk. Bv. Je lis pendant qu'il cuisine (ik lees terwijl hij kookt). Hier gaat het om een tegenstelling.", 2: "Puisque = aangezien: een reden. Hier is het een tegenstelling.", 3: "Donc = dus: een gevolg. Hier is het een tegenstelling." } },
        { t: "mc", label: "puisque (aangezien)", q: "Welk woord past?", s: "___ tu connais la réponse, dis-la-nous !", full: "Puisque tu connais la réponse, dis-la-nous !", nl: "Aangezien je het antwoord kent, zeg het ons!", o: ["Sinon", "Pendant que", "Puisque", "Donc"], a: 2, tip: "Puisque = aangezien: een reden die de ander ook al kent. Kan vooraan in de zin staan.", why: { 0: "Sinon = anders. Dat past niet vooraan in deze zin.", 1: "Pendant que = terwijl (tegelijk). Hier volgt een reden.", 3: "Donc = dus: een gevolg. Hier volgt een reden." } },
        { t: "mc", label: "sinon (anders)", q: "Welk woord past?", s: "Range ta chambre, ___ tu ne sors pas ce soir.", full: "Range ta chambre, sinon tu ne sors pas ce soir.", nl: "Ruim je kamer op, anders ga je vanavond niet uit.", o: ["parce que", "sinon", "alors que", "dès que"], a: 1, tip: "Sinon = anders.", why: { 0: "Parce que = omdat: een reden. Hier volgt wat er gebeurt als je het niet doet.", 2: "Alors que = terwijl (tegenstelling).", 3: "Dès que = zodra." } },
        { t: "build", label: "dès que in een zin", q: "Bouw de zin", nl: "Bel me zodra je thuis bent.", tiles: ["tu", "appelle-moi", "à la maison", "dès que", "es", "pendant que"], ans: "appelle-moi dès que tu es à la maison", full: "Appelle-moi dès que tu es à la maison.", tip: "Zodra = dès que. Pendant que zou 'terwijl' betekenen." },
        { t: "build", label: "pendant que in een zin", q: "Bouw de zin", nl: "Ik lees terwijl hij kookt.", tiles: ["cuisine", "je lis", "alors qu'il", "pendant qu'il"], ans: "je lis pendant qu'il cuisine", full: "Je lis pendant qu'il cuisine.", tip: "Twee dingen tegelijk: pendant que. Alors que zou een tegenstelling zijn. Que + il wordt qu'il." },
        { t: "type", label: "car (want)", q: "Vul aan", nl: "Ik stop, want ik ben moe.", s: "J'arrête, ___ je suis fatigué.", full: "J'arrête, car je suis fatigué.", accept: ["car"], show: "car", ok2: { "parce que": "In het Frans kan parce que hier ook. Maar de Nederlandse zin zegt 'want', en dat is car." }, tip: "Car = want, parce que = omdat. Car staat na een komma en nooit vooraan in de zin; het is wat formeler. Parce que kan wel vooraan staan en is het antwoord op 'Pourquoi ?'.", why: { "pendant que": "Pendant que = terwijl (tegelijk). Hier volgt een reden." } },
        { t: "type", label: "alors que (terwijl, tegenstelling)", q: "Vul aan", nl: "Hij is rijk, terwijl zijn broer arm is.", s: "Il est riche, ___ son frère est pauvre.", full: "Il est riche, alors que son frère est pauvre.", accept: ["alors que", "tandis que"], show: "alors que (of: tandis que)", tip: "Tegenstelling (rijk tegenover arm): alors que of tandis que.", why: { "pendant que": "Pendant que is 'terwijl' in de tijd: twee dingen gebeuren tegelijk. Bv. Je fais mes devoirs pendant que ma sœur regarde la télé (ik maak mijn huiswerk terwijl mijn zus tv kijkt). Hier gaat het niet om tijd maar om een tegenstelling.", "parce que": "Parce que = omdat: een reden. Hier is het een tegenstelling." } },
        { t: "mc", fr2nl: true, label: "alors que in een zin", q: "Wat betekent deze zin?", s: "Il est parti sans rien dire, alors que tout le monde l'attendait.", full: "Il est parti sans rien dire, alors que tout le monde l'attendait.", nl: "Hij vertrok zonder iets te zeggen, terwijl iedereen op hem wachtte.", o: ["Hij vertrok zonder iets te zeggen, terwijl iedereen op hem wachtte.", "Hij vertrok zonder iets te zeggen, omdat iedereen op hem wachtte.", "Hij vertrok zonder iets te zeggen, zodra iedereen op hem wachtte."], a: 0, tip: "Alors que = terwijl (tegenstelling)." }
      ]},
      { key: "ww", color: "#DCC6A0", name: "Werkwoorden: tijden", ex: [
        { t: "type", label: "finir · passé composé", q: "Vul het werkwoord in", tense: "passé composé", s: "Hier, nous ___ (finir) le travail.", full: "Hier, nous avons fini le travail.", nl: "Gisteren hebben we het werk afgemaakt.", accept: ["avons fini"], show: "avons fini", tip: "Passé composé = avoir of être + voltooid deelwoord. finir → fini.", why: { "finissons": "Dat is de présent. Hier (gisteren) vraagt een verleden tijd: passé composé.", "finissions": "Dat is de imparfait. Voor één afgeronde handeling: passé composé." } },
        { t: "type", label: "jouer · imparfait", q: "Vul het werkwoord in", tense: "imparfait", s: "Quand j'étais petite, je ___ (jouer) souvent dehors.", full: "Quand j'étais petite, je jouais souvent dehors.", nl: "Toen ik klein was, speelde ik vaak buiten.", accept: ["jouais"], show: "jouais", tip: "Een gewoonte in het verleden: imparfait. Stam van nous jouons + -ais.", why: { "ai joué": "Passé composé is voor een afgeronde gebeurtenis. 'Souvent' wijst op een gewoonte: imparfait.", "jouai": "Dat is de passé simple. Hier: imparfait." } },
        { t: "mc", label: "aller · futur simple", q: "Welke vorm past?", tense: "futur simple", s: "Demain, ils ___ à Paris.", full: "Demain, ils iront à Paris.", nl: "Morgen gaan ze naar Parijs.", o: ["iront", "allaient", "sont allés"], a: 0, tip: "Demain → futur simple. Aller heeft een onregelmatige stam: ir-.", why: { 1: "Allaient is imparfait (verleden). Demain = morgen.", 2: "Sont allés is passé composé (verleden). Demain = morgen." } },
        { t: "mc", label: "lire · conditionnel", q: "Welke vorm past?", tense: "conditionnel", s: "Si j'avais le temps, je ___ plus.", full: "Si j'avais le temps, je lirais plus.", nl: "Als ik tijd had, zou ik meer lezen.", o: ["lirais", "lirai", "lis"], a: 0, tip: "Si + imparfait → conditionnel in de hoofdzin: je lirais.", why: { 1: "Lirai is futur simple. Na si + imparfait komt de conditionnel (-ais).", 2: "Lis is présent. Na si + imparfait komt de conditionnel." } },
        { t: "type", label: "venir · passé composé", q: "Vul het werkwoord in", tense: "passé composé (met être)", s: "Elle ___ (venir) hier soir.", full: "Elle est venue hier soir.", nl: "Ze is gisteravond gekomen.", accept: ["est venue"], show: "est venue", tip: "Venir vervoegt met être. Dan past het deelwoord zich aan het onderwerp aan: elle → venue.", why: { "a venu": "Venir gaat met être, niet met avoir.", "est venu": "Bijna. Met être past het deelwoord zich aan: elle → venue (met -e)." } },
        { t: "mc", label: "faire · subjonctif", q: "Welke vorm past?", tense: "subjonctif", s: "Il faut que tu ___ tes devoirs.", full: "Il faut que tu fasses tes devoirs.", nl: "Je moet je huiswerk maken.", o: ["fasses", "fais", "feras"], a: 0, tip: "Na il faut que volgt de subjonctif: que tu fasses.", why: { 1: "Fais is présent. Na il faut que: subjonctif.", 2: "Feras is futur. Na il faut que: subjonctif." } },
        { t: "mc", fr2nl: true, label: "je lisais · imparfait", q: "Wat betekent deze zin?", tense: "imparfait", s: "Quand j'étais petite, je lisais beaucoup.", full: "Quand j'étais petite, je lisais beaucoup.", nl: "Toen ik klein was, las ik veel.", o: ["Toen ik klein was, las ik veel.", "Als ik klein ben, lees ik veel.", "Toen ik klein was, zou ik veel lezen."], a: 0, tip: "Lisais is imparfait: een gewoonte in het verleden." },
        { t: "mc", fr2nl: true, label: "j'achèterais · conditionnel", q: "Wat betekent deze zin?", tense: "conditionnel", s: "Si j'avais de l'argent, j'achèterais une voiture.", full: "Si j'avais de l'argent, j'achèterais une voiture.", nl: "Als ik geld had, zou ik een auto kopen.", o: ["Als ik geld had, zou ik een auto kopen.", "Als ik geld heb, koop ik een auto.", "Toen ik geld had, kocht ik een auto."], a: 0, tip: "Si + imparfait, en dan de conditionnel: j'achèterais = ik zou kopen." },
        { t: "mc", fr2nl: true, label: "nous partirons · futur simple", q: "Wat betekent deze zin?", tense: "futur simple", s: "Nous partirons demain matin.", full: "Nous partirons demain matin.", nl: "We zullen morgenochtend vertrekken.", o: ["We zullen morgenochtend vertrekken.", "We zijn gisterochtend vertrokken.", "We zouden morgenochtend vertrekken."], a: 0, tip: "Partirons is futur simple: iets wat nog gaat gebeuren." }
      ]},
      { key: "vnw", color: "#E9B3CF", name: "Voornaamwoorden (COD / COI)", ex: [
        { t: "mc", label: "la (COD)", q: "Welk voornaamwoord past?", s: "Tu vois Marie ? — Oui, je ___ vois.", full: "Tu vois Marie ? — Oui, je la vois.", nl: "Zie je Marie? — Ja, ik zie haar.", o: ["la", "lui", "le"], a: 0, tip: "Voir quelqu'un: zonder à, dus een direct voorwerp (COD). Marie → la.", why: { 1: "Lui staat voor à + persoon (COI). Voir heeft geen à.", 2: "Le is mannelijk. Marie → la." } },
        { t: "mc", label: "lui (COI)", q: "Welk voornaamwoord past?", s: "Tu téléphones à ton père ? — Oui, je ___ téléphone.", full: "Tu téléphones à ton père ? — Oui, je lui téléphone.", nl: "Bel je je vader? — Ja, ik bel hem.", o: ["le", "lui", "leur"], a: 1, tip: "Téléphoner à quelqu'un: met à, dus COI. Eén persoon → lui.", why: { 0: "Le is een direct voorwerp (COD). Téléphoner à → COI → lui.", 2: "Leur is meervoud. Ton père is één persoon → lui." } },
        { t: "mc", label: "leur (COI, meervoud)", q: "Welk voornaamwoord past?", s: "Tu as parlé à tes amis ? — Oui, je ___ ai parlé.", full: "Tu as parlé à tes amis ? — Oui, je leur ai parlé.", nl: "Heb je met je vrienden gepraat? — Ja, ik heb met hen gepraat.", o: ["les", "leur", "lui"], a: 1, tip: "Parler à + meerdere personen → leur (zonder -s).", why: { 0: "Les is COD. Parler à → COI → leur.", 2: "Lui is enkelvoud. Tes amis → leur." } },
        { t: "build", label: "le lui (volgorde)", q: "Bouw de zin", nl: "Het boek? Ik geef het aan hem.", tiles: ["donne", "le", "je", "leur", "lui"], ans: "je le lui donne", full: "Le livre ? Je le lui donne.", tip: "Volgorde: le / la / les komen vóór lui / leur. Aan hem = lui (enkelvoud)." },
        { t: "type", label: "les (COD, meervoud)", q: "Vul het voornaamwoord in", nl: "Die schoenen? Die koop ik morgen.", s: "Ces chaussures ? Je ___ achète demain.", full: "Ces chaussures ? Je les achète demain.", accept: ["les"], show: "les", tip: "Acheter quelque chose: direct voorwerp. Meervoud → les.", why: { "leur": "Leur is voor à + personen. Acheter quelque chose: direct → les.", "la": "La is enkelvoud. Ces chaussures → les." } },
        { t: "mc", fr2nl: true, label: "leur in een zin", q: "Wat betekent deze zin?", s: "Je leur ai donné mon adresse.", full: "Je leur ai donné mon adresse.", nl: "Ik heb hun mijn adres gegeven.", o: ["Ik heb hun mijn adres gegeven.", "Ik heb hem mijn adres gegeven.", "Ik heb mijn adres van hen gekregen."], a: 0, tip: "Leur = (aan) hen, hun: meervoud. Lui zou 'hem' of 'haar' zijn." }
      ]},
      { key: "lw", color: "#9FB4C8", name: "Lidwoorden", ex: [

  check: function(){ var ex=cur(); if(ex.t==="build"){ var made=S.built.map(function(k){return ex.tiles[k];}).join(" "); finish(norm(made)===norm(ex.ans)); } else { var g=norm(S.typed); var ok=ex.accept.map(norm).indexOf(g)>=0; var alt=!ok && !!(ex.ok2&&ex.ok2[g]); finish(ok||alt,{ok2:alt,typedFinal:g}); } },

  retry: function(){ var q=S.wrong.slice(); set({phase:"ex",queue:q,perm:perms(q),wrong:[],pos:0,score:0,round:S.round+1,answered:false,correct:false,ok2:false,picked:-1,typed:"",typedFinal:"",built:[],revealed:false}); window.scrollTo(0,0); autoSay(); },
  restart: function(){ S=fresh(S); render(); window.scrollTo(0,0); }
};

function head(chip,color,right,p){
  var c = chip ? '<span class="chip">'+esc(chip)+'</span>' : '<span></span>';
  return '<div class="head">'+c+'<span>'+esc(right)+'</span></div><div class="bar"><div style="width:'+Math.round(p)+'%"></div></div>';
}
var FLOWER = '<svg aria-hidden="true" width="92" height="120" viewBox="0 0 92 120" style="align-self:flex-end"><path d="M46 52 L46 118" stroke="#1F2D44" stroke-width="4"/><path d="M46 92 C30 84 26 72 28 66 C38 70 46 80 46 92Z" fill="#1F2D44"/><path d="M46 104 C62 96 66 84 64 78 C54 82 46 92 46 104Z" fill="#E07AB6"/><g fill="#E8492B"><circle cx="46" cy="18" r="11"/><circle cx="68" cy="27" r="11"/><circle cx="77" cy="49" r="11"/><circle cx="68" cy="71" r="11"/><circle cx="24" cy="71" r="11"/><circle cx="15" cy="49" r="11"/><circle cx="24" cy="27" r="11"/></g><circle cx="46" cy="49" r="17" fill="#EBB02F"/><circle cx="46" cy="49" r="8" fill="#FFF9EE"/></svg>';

function render(){
  var h="";
  if(S.phase==="start"){
    var due=dueIds(), nd=S.review?due.length:0, avail=buildQueue(S.chosen,0).length, base=S.size>0?Math.min(S.size,avail):avail, planned=nd+buildQueue(S.chosen,S.size).filter(function(i){ return !S.review || due.indexOf(i)<0; }).length, min=Math.max(1,Math.round(planned*0.5));
    var dn=["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"], mn=["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"], now=new Date();
    h+='<div class="grow"><div><div class="small muted">'+dn[now.getDay()]+' '+now.getDate()+' '+mn[now.getMonth()]+'</div><div class="hello">Bonjour !</div></div>'+(due.length?'<div class="list"><label class="row" for="t-review"><span class="txt"><span>Herhalen van vorige keer</span><span class="small muted">'+due.length+(due.length===1?' oefening':' oefeningen')+' · komen eerst</span></span><input class="sr" type="checkbox" id="t-review" data-a="toggleReview"'+(S.review?' checked':'')+'><span class="sw" aria-hidden="true"></span></label></div>':'')+'<h1>Wat wil je oefenen?</h1><div class="list">';
    TOPICS.forEach(function(tp){ h+='<label class="row" for="t-'+tp.key+'"><span class="txt"><span>'+esc(tp.name)+'</span><span class="small muted">'+tp.ex.length+' oefeningen</span></span><input class="sr" type="checkbox" id="t-'+tp.key+'" data-a="toggle" data-v="'+tp.key+'"'+(S.chosen[tp.key]?' checked':'')+'><span class="sw" aria-hidden="true"></span></label>'; });
    h+='</div><div style="display:flex;flex-direction:column;gap:8px"><span class="small muted">Aantal oefeningen</span><div class="pills">';
    [[10,"10"],[15,"15"],[0,"Alles"]].forEach(function(z){ h+='<button class="pill'+(S.size===z[0]?' on':'')+'" data-a="size" data-v="'+z[0]+'">'+z[1]+'</button>'; });
    h+='</div><span class="small muted">'+(planned?planned+' oefeningen'+(nd?' (waarvan '+nd+' herhaling)':', gemengd')+' · ongeveer '+min+' min (schatting)':'Kies minstens één onderwerp.')+'</span></div>';
    h+='<div style="display:flex;align-items:center;gap:12px"><button class="spk" aria-label="Test het geluid" data-a="test">'+SPK+'</button><span class="s15 muted" id="ttsmsg">'+esc(S.ttsMsg||"Test het geluid")+'</span></div>';
    h+='<div class="bottom"><button class="btn" data-a="start"'+(planned?'':' disabled')+'>Start</button>'+(S.chosen.voeg?'<button class="link" data-a="intro">Eerst de voegwoorden bekijken (7 kaartjes)</button>':'')+'</div></div>';
  } else if(S.phase==="intro"){
    var c=CARDS[S.introIdx];
    h+=head("Voegwoorden",COLOR.voeg,(S.introIdx+1)+" / "+CARDS.length,(S.introIdx+1)/CARDS.length*100);
    h+='<div class="grow"><p class="s15 muted" style="margin:6px 0 0">Lees het woord, de zin en de vertaling.</p><div class="card"><div class="saywrap"><div style="font-size:30px;font-weight:700;line-height:1.1;flex-grow:1">'+esc(c.fr)+'</div>'+spk(c.fr)+'</div><div style="font-size:18px">'+esc(c.nl)+'</div><div class="sep saywrap"><div style="font-size:19px;flex-grow:1">'+esc(c.ex)+'</div>'+spk(c.ex)+'</div><div class="s15 muted">'+esc(c.exNl)+'</div></div>';
    h+='<div class="bottom"><button class="btn" data-a="introNext">'+(S.introIdx<CARDS.length-1?'Volgende →':'Start de oefeningen →')+'</button></div></div>';
  } else if(S.phase==="ex"){
    var ex=cur(), id=S.queue[S.pos], total=S.queue.length, col=COLOR[ex.key];
    h+=head((S.reviewSet.indexOf(id)>=0?"Herhaling · ":"")+ex.topic+(S.round>1?" · fouten":""),col,(S.pos+1)+" / "+total,(S.pos+(S.answered?1:0))/total*100);
    h+='<div class="grow">';
    var showNl = !ex.fr2nl && !isListen(ex) && (ex.t!=="mc" || ex.key==="ww");
    if(showNl) h+='<div style="font-size:18px;margin-top:6px">'+esc(ex.nl)+'</div>';
    if(isListen(ex)){
      h+='<div class="lrow"><button class="play" aria-label="Speel de zin af" data-a="say" data-v="'+esc(ex.full)+'">'+PLAY+'</button><button class="pill'+(S.slow?' on':'')+'" style="flex:none;padding:0 16px" data-a="slow">Trager</button></div>';
      h+='<div class="s15 muted" id="ttsmsg">'+esc(S.ttsMsg||"")+'</div>';
    }
    if(ex.s){
      var hideSpk = ex.s.indexOf("___")>=0 || isListen(ex);
      h+='<div class="saywrap" style="margin-top:6px"><div class="sent" style="flex-grow:1">'+esc(ex.s)+'</div>'+(hideSpk?'':spk(ex.s))+'</div>';
    }
    h+='<div class="s15 muted" style="margin-top:-8px">'+esc(ex.q)+'</div>';
    var order = S.perm[id];
    if(ex.t==="mc"||ex.t==="lmc"){ h+='<div class="opts">'; order.forEach(function(i){ var o=ex.o[i]; var cl="opt"; var mark=""; if(S.answered&&i===ex.a){ cl+=" right"; mark='<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F6B43" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'; } else if(S.answered&&i===S.picked) cl+=" wrong"; h+='<button class="'+cl+'" data-a="pick" data-v="'+i+'"><span>'+esc(o)+'</span>'+mark+'</button>'; }); h+='</div>'; }
    if(ex.t==="build"){ h+='<div class="dropzone">'; if(!S.built.length) h+='<span class="s15 muted" style="padding-left:6px">Tik de stukjes in de juiste volgorde.</span>'; S.built.forEach(function(k,j){ h+='<button class="tile in" data-a="remove" data-v="'+j+'">'+esc(ex.tiles[k])+'</button>'; }); h+='</div><div class="tiles">'; order.forEach(function(k){ if(S.built.indexOf(k)<0) h+='<button class="tile" data-a="add" data-v="'+k+'">'+esc(ex.tiles[k])+'</button>'; }); h+='</div>'; }
    if(ex.t==="lrep" && !S.answered){
      if(!S.revealed) h+='<button class="btn2" data-a="reveal">Toon de zin</button>';
      else h+='<div class="card"><div class="sent">'+esc(ex.full)+'</div><div class="s15 muted">'+esc(ex.nl)+'</div><div class="s15 muted">'+esc(ex.tip)+'</div></div><div class="small muted">Kon je de zin vlot nazeggen?</div><div class="pills"><button class="pill" data-a="self" data-v="1">Gelukt</button><button class="pill" data-a="self" data-v="0">Nog niet</button></div>';
    }
    if(ex.t==="type"||ex.t==="ldict"){ h+='<div style="display:flex;flex-direction:column;gap:6px"><label for="ans" class="small muted">Jouw antwoord</label><input id="ans" class="inp" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" value="'+esc(S.typed)+'"'+(S.answered?' readonly':'')+'></div>'; }
    if(S.answered){
      var why=""; if(ex.why){ if(ex.t==="mc"&&S.picked!==ex.a&&ex.why[S.picked]) why=ex.why[S.picked]; if(ex.t==="type"&&!S.correct&&ex.why[S.typedFinal]) why=ex.why[S.typedFinal]; } if(S.ok2&&ex.ok2&&ex.ok2[S.typedFinal]) why=ex.ok2[S.typedFinal];
      var corr=(ex.t==="mc"||ex.t==="lmc")?ex.o[ex.a]:(ex.t==="build"?ex.full:(ex.show||""));
      var ok=S.correct, vtxt;
      if(ex.t==="lrep") vtxt = ok ? "Gelukt." : "Komt terug.";
      else vtxt = ok ? (S.ok2 ? "Ook juist." : "Juist.") : "Bijna.";
      if(ex.tense) vtxt += " Het is " + ex.tense + ".";
      var showCorr = (!ok||S.ok2) && ex.t!=="lrep" && ex.t!=="mc" && ex.t!=="lmc";
      h+='<div class="fb"><div><span class="'+(ok?'v-ok':'v-no')+'">'+esc(vtxt)+'</span>'+(showCorr?' <span>Juist: <b>'+esc(corr)+'</b></span>':'')+'</div>';
      if(why) h+='<div class="s15">'+esc(why)+'</div>';
      h+='<div class="s15 muted">'+esc(ex.tip)+'</div>';
      h+='<div class="saywrap" style="margin-top:4px"><div style="flex-grow:1"><div>'+esc(ex.full)+'</div><div class="s15 muted">'+esc(ex.nl)+'</div></div>'+spk(ex.full)+'</div></div>';
    }
    h+='<div class="bottom">';
    if(!S.answered&&ex.t==="build") h+='<button class="btn" data-a="check"'+(S.built.length?'':' disabled')+'>Controleer</button>';
    if(!S.answered&&(ex.t==="type"||ex.t==="ldict")) h+='<button class="btn" id="checkbtn" data-a="check"'+(norm(S.typed)?'':' disabled')+'>Controleer</button>';
    if(S.answered) h+='<button class="btn" data-a="next">Volgende →</button>';
    h+='</div></div>';
  } else {
    var tot=S.queue.length, r=tot?S.score/tot:0;
    var ch=r===1?["Chapeau !","Petje af!"]:(r>=0.7?["Bien joué !","Goed gedaan!"]:["Petit à petit, l'oiseau fait son nid.","Stap voor stap kom je er wel. Letterlijk: beetje bij beetje bouwt de vogel zijn nest."]);
    var pc=Math.round(r*100); h+='<div class="grow"><div class="ring" style="background:conic-gradient(#E3A587 '+(pc*3.6)+'deg, #ECE6DC 0deg)"><div>'+pc+'%</div></div><div style="text-align:center"><div class="cheer">'+esc(ch[0])+'</div><div class="s15 muted" style="margin-top:4px">'+esc(ch[1])+'</div></div><div style="font-size:18px;text-align:center" class="muted">'+S.score+' van de '+tot+' juist'+(S.round>1?' (fouten opnieuw)':'')+'</div>';
    if(S.wrong.length){ h+='<div class="card" style="gap:2px"><div class="small muted">Fouten · komen morgen terug</div>'; S.wrong.forEach(function(id){ h+='<div style="padding:8px 0;border-bottom:1px solid #ECE6DC;display:flex;gap:10px;align-items:center"><span>'+esc(EX[id].label)+'</span></div>'; }); h+='</div>'; }
    else h+='<p style="margin:0;text-align:center">Alles juist.</p>';
    var tc=tomorrowCount(); h+='<p class="s15 muted" style="margin:0;text-align:center">'+(tc?'Morgen '+(tc===1?'staat er 1 oefening':'staan er '+tc+' oefeningen')+' klaar om te herhalen.':'Morgen staat er niets te herhalen.')+'</p>';
    h+='<div class="bottom">'+(S.wrong.length?'<button class="btn" data-a="retry">Fouten nu nog eens</button>':'')+'<button class="btn2" data-a="restart">Nieuwe les</button></div></div>';
  }
  document.getElementById("app").innerHTML=h;
}

var app=document.getElementById("app");
app.addEventListener("click",function(e){ var t=e.target.closest("[data-a]"); if(!t||t.disabled||t.type==="checkbox") return; A[t.getAttribute("data-a")](t.getAttribute("data-v")); });
app.addEventListener("change",function(e){ var t=e.target; if(t.type!=="checkbox") return; var a=t.getAttribute("data-a"); if(a==="toggle") A.toggle(t.getAttribute("data-v")); if(a==="toggleReview") A.toggleReview(); });
app.addEventListener("input",function(e){ if(e.target.id==="ans"){ S.typed=e.target.value; var b=document.getElementById("checkbtn"); if(b) b.disabled=!norm(S.typed); } });
app.addEventListener("keydown",function(e){ if(e.target.id==="ans"&&e.key==="Enter"&&!S.answered&&norm(S.typed)) A.check(); });
render();
if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("sw.js").catch(function(){}); } catch(e){} }
